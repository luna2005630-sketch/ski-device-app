<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>설雪 · 스키장비 대여 데모</title><style>
:root{--navy:#102a43;--blue:#0b6efd;--sky:#dff3ff;--ice:#f7fbff;--orange:#ff8a3d;--ink:#17324d;--muted:#68809b;--line:#d7e5f1}*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;color:var(--ink);background:linear-gradient(#d8f1ff 0 25%,#f7fbff 65%);min-height:100vh}button,input{font:inherit}button{border:0;border-radius:14px;padding:15px 20px;font-weight:800;cursor:pointer}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:white}.app{max-width:1100px;margin:auto;min-height:100vh;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:25px;font-weight:900}.brand span{color:var(--blue)}.badge{background:#fff5dd;color:#a05a00;padding:8px 12px;border-radius:20px;font-size:13px;font-weight:bold}.card{background:#ffffffed;border:1px solid #e0edf7;border-radius:24px;padding:28px;box-shadow:0 14px 35px #1b557611}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#e7f7ff,#fff);min-height:230px}.hero:after{content:'⛷️';font-size:170px;position:absolute;right:40px;bottom:-25px;filter:drop-shadow(0 10px 4px #8ab3c455)}h1{font-size:34px;margin:0 0 12px;position:relative;z-index:1}h2{margin:0 0 18px}p{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.primary{background:var(--blue);color:white}.secondary{background:#eaf4ff;color:var(--blue)}.danger{background:#ffe9e5;color:#c53b2b}.form{display:grid;gap:12px;max-width:480px}.links{display:flex;gap:18px;justify-content:center;margin-top:15px}.links button{padding:6px;background:none;color:var(--blue)}.item{border:2px solid var(--line);border-radius:18px;padding:14px;text-align:center;background:white}.item.selected{border-color:var(--blue);background:#eef7ff}.item .pic{font-size:65px;height:82px;display:grid;place-items:center}.item h3{margin:8px 0}.step{display:flex;gap:8px;margin-bottom:18px}.step span{padding:8px 12px;border-radius:20px;background:#eaf1f7;color:#7590a8;font-size:13px}.step .on{background:var(--blue);color:white}.qty{display:flex;justify-content:center;align-items:center;gap:14px}.qty button{padding:5px 12px;border-radius:10px;background:#eaf4ff;color:var(--blue)}.summary{background:#f2f8fd;border-radius:16px;padding:16px;margin-top:16px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #deebf4}.row:last-child{border:0}.upload{border:2px dashed #a7c7df;border-radius:18px;padding:28px;text-align:center;background:#f9fdff}.upload input{border:0}.preview{max-width:180px;max-height:130px;border-radius:12px;margin-top:12px}.notice{padding:13px;border-radius:12px;background:#fff7df;color:#845800;margin:12px 0}.ok{background:#e5faef;color:#167346}.tabs{display:flex;gap:10px;margin-bottom:18px}.tabs button{flex:1}.hide{display:none}@media(max-width:600px){.app{padding:14px}h1{font-size:27px}.hero:after{font-size:110px;right:5px}.hero{min-height:200px}}
</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script></head><body><main class="app"><div class="top"><div class="brand">❄️ 설雪 <span>SKI RENTAL</span></div><div><div class="badge">수업용 데모 · 오프라인</div><button class="danger" style="margin-top:8px;padding:9px 13px" onclick="logout()">로그아웃</button></div></div><div id="app"></div></main><script>
const firebaseConfig={apiKey:"AIzaSyA3a_lFxwigAfG9iE1ni4YxV0d0cmmcGRA",authDomain:"sport-ai-makers-6a6ff.firebaseapp.com",projectId:"sport-ai-makers-6a6ff",storageBucket:"sport-ai-makers-6a6ff.firebasestorage.app",messagingSenderId:"621857187568",appId:"1:621857187568:web:2426a485c2525516dc8435",measurementId:"G-K0TPWDZ8Y9"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const db=firebase.firestore();let rentalDocId=null;const products=[['스키','🎿'],['부츠','🥾'],['헬멧','⛑️'],['스키복','🧥'],['폴대','🏒'],['고글','🥽']];let state=JSON.parse(localStorage.getItem('skiDemo')||'null')||{screen:'login',rented:[],start:null,photo:null,analysis:null,points:0};function save(){localStorage.setItem('skiDemo',JSON.stringify(state))}function go(screen){state.screen=screen;save();render()}function field(label,type='text',ph=''){return `<label>${label}<input type="${type}" placeholder="${ph}"></label>`}function render(){let a=document.querySelector('#app');a.innerHTML=views[state.screen]();}const views={login:()=>`<section class="card hero"><h1>눈 위의 하루를<br>더 가볍게 시작해요</h1><p>간편한 스키 장비 대여·반납 체험</p></section><section class="card" style="margin-top:18px"><h2>로그인</h2><div class="form">${field('아이디','text','아이디를 입력하세요')}${field('비밀번호','password','비밀번호를 입력하세요')}<button class="primary" onclick="loginUser()">로그인</button></div><div class="links"><button onclick="alert('데모에서는 아무 값이나 입력해 주세요.')">아이디 찾기</button><button onclick="alert('데모에서는 아무 값이나 입력해 주세요.')">비밀번호 찾기</button><button onclick="go('signup')">회원가입</button></div></section>`,signup:()=>`<section class="card"><div class="step"><span class="on">1 회원정보</span><span>2 대여 시작</span></div><h2>회원가입 <small class="badge">수업용 데모</small></h2><div class="form">${field('이메일','email')}${field('이름')}${field('비밀번호','password')}${field('비밀번호 재입력','password')}${field('전화번호','tel')}<button class="primary" onclick="registerUser()">회원가입하고 시작하기</button></div></section>`,home:()=>`<section class="card hero"><h1>반가워요!<br>무엇을 도와드릴까요?</h1><p>원하는 메뉴를 큰 버튼으로 선택하세요.</p><div class="actions"><button class="primary" onclick="go('rent')">🎿 장비 대여</button><button class="secondary" onclick="go('return')">📦 장비 반납</button></div></section>${state.rented.length?`<section class="card" style="margin-top:18px"><h2>현재 대여 중</h2><p>${state.rented.map(x=>x.name+' '+x.qty+'개').join(' · ')}</p><button class="secondary" onclick="go('return')">대여 목록 보기</button></section>`:''}`,rent:()=>`<section class="card"><div class="step"><span>1 로그인</span><span class="on">2 장비 선택</span><span>3 반납</span><span>4 결제</span></div><h2>장비 대여</h2><p>원하는 장비의 개수를 선택하세요. 모든 장비는 같은 사이즈의 데모 이미지입니다.</p><div class="grid">${products.map((p,i)=>{let x=state.rented.find(x=>x.name===p[0]);return `<div class="item ${x?'selected':''}"><div class="pic">${p[1]}</div><h3>${p[0]}</h3><div class="qty"><button onclick="changeQty(${i},-1)">−</button><b>${x?.qty||0}</b><button onclick="changeQty(${i},1)">＋</button></div></div>`}).join('')}</div><div class="actions"><button class="primary" onclick="startRental()">대여 시작하기</button><button class="secondary" onclick="go('home')">돌아가기</button></div></section>`,return:()=>`<section class="card"><div class="step"><span>1 대여</span><span class="on">2 반납 확인</span><span>3 결제</span></div><h2>장비 반납</h2>${state.rented.length?`<div class="summary"><b>대여 목록</b>${state.rented.map(x=>`<div class="row"><span>${x.icon} ${x.name} × ${x.qty}</span><span>₩${(x.qty*10000).toLocaleString()}</span></div>`).join('')}</div><div class="upload" style="margin-top:16px"><b>📷 사진 판독 체험</b><p>반납한 장비 사진을 업로드해 보세요.</p><input type="file" accept="image/*" onchange="upload(event)">${state.photo?`<img class="preview" src="${state.photo}"><br><button class="danger" onclick="clearPhoto()">사진 삭제</button>`:''}</div>${state.analysis?`<div class="notice ${state.analysis==='전체 일치'?'ok':''}">분석 결과: <b>${state.analysis}</b>${state.analysis==='전체 일치'?'<br>장비가 모두 확인되었습니다.':'<br>사진을 다시 업로드해 주세요.'}</div>`:''}<div class="actions">${state.analysis==='전체 일치'?`<button class="primary" onclick="completeReturn()">이용 결과 보기</button>`:''}<button class="secondary" onclick="go('home')">돌아가기</button></div>`:`<div class="notice">현재 대여 중인 장비가 없습니다.</div><button class="primary" onclick="go('rent')">장비 대여하러 가기</button>`}</section>`,result:()=>{let mins=Math.max(1,Math.ceil((Date.now()-state.start)/60000)),count=state.rented.reduce((s,x)=>s+x.qty,0),base=count*10000+mins*10000,add=count*10+Math.ceil(mins/60)*10;return `<section class="card"><h2>이용 결과</h2><div class="summary">${state.rented.map(x=>`<div class="row"><span>${x.icon} ${x.name} × ${x.qty}</span><b>₩${(x.qty*10000).toLocaleString()}</b></div>`).join('')}<div class="row"><span>총 소요 시간</span><b>${mins}분</b></div><div class="row"><span>기본 요금</span><b>₩${base.toLocaleString()}</b></div></div><div class="form" style="margin-top:16px">${field('사용할 누적 포인트 (10P = 1,000원 할인)','number','0')}<button class="primary" onclick="pay(${base},${add})">결제 단계로 이동</button></div><p>현재 누적 포인트: ${state.points}P · 이번 이용 추가 예정: ${add}P</p></section>`},pay:()=>`<section class="card"><h2>결제</h2><div class="tabs"><button class="primary" onclick="showPay('bank')">계좌이체</button><button class="secondary" onclick="showPay('card')">신용카드</button></div><div id="paybox" class="form">${field('계좌번호','text','서경은행 123456-7890')}<button class="primary" onclick="finishPay()">결제하기</button></div><div id="paid" class="notice ok hide">결제되었습니다. 잠시 후 대여/반납 화면으로 이동합니다.</div></section>`};
function changeQty(i,d){let p=products[i],x=state.rented.find(x=>x.name===p[0]);if(!x&&d>0)state.rented.push({name:p[0],icon:p[1],qty:1});else if(x){x.qty=Math.max(0,x.qty+d);if(!x.qty)state.rented=state.rented.filter(y=>y!==x)}save();render()}function startRental(){if(!state.rented.length)return alert('장비를 한 개 이상 선택해 주세요.');state.start=Date.now();const items={ski:0,boots:0,poles:0};state.rented.forEach(x=>{if(x.name==='스키')items.ski=x.qty;if(x.name==='부츠')items.boots=x.qty;if(x.name==='폴대')items.poles=x.qty});const u=auth.currentUser;if(u){db.collection('users').doc(u.uid).collection('rentals').add({items:items,status:'active',startedAt:firebase.firestore.FieldValue.serverTimestamp(),createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(d=>{rentalDocId=d.id;save();alert('대여 기록이 Firestore에 저장되었습니다.');go('home')}).catch(e=>alert('대여 기록 저장 실패: '+e.message))}else{save();go('home')}}function upload(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{state.photo=r.result;state.analysis=['전체 일치','장비 누락','판독 어려움'][Math.floor(Math.random()*3)];save();render()};r.readAsDataURL(f)}function clearPhoto(){state.photo=null;state.analysis=null;save();render()}function pay(base,add){state.points=Number(prompt('사용할 포인트를 입력하세요 (10P 단위 권장)',0))||0;go('pay')}function showPay(type){document.querySelector('#paybox').innerHTML=type==='bank'?`${field('계좌번호','text','서경은행 123456-7890')}<button class="primary" onclick="finishPay()">결제하기</button>`:`${field('카드번호','text','0000-0000-0000-0000')}${field('이름')}${field('CVC 번호','password','000')}<button class="primary" onclick="finishPay()">결제하기</button>`}function completeReturn(){const u=auth.currentUser;if(!u||!rentalDocId)return go('result');const mins=Math.max(1,Math.ceil((Date.now()-state.start)/60000)),count=state.rented.reduce((s,x)=>s+x.qty,0),items={ski:0,boots:0,poles:0};state.rented.forEach(x=>{if(x.name==='스키')items.ski=x.qty;if(x.name==='부츠')items.boots=x.qty;if(x.name==='폴대')items.poles=x.qty});const earned=(items.ski+items.boots+items.poles)*10,amount=count*10000+mins*10000;db.collection('users').doc(u.uid).collection('rentals').doc(rentalDocId).update({status:'returned',returnedItems:items,durationMinutes:mins,earnedPoints:earned,totalAmount:amount,returnedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>go('result')).catch(e=>alert('반납 기록 저장 실패: '+e.message))}function finishPay(){document.querySelector('#paid').classList.remove('hide');const u=auth.currentUser;if(u&&rentalDocId){const mins=Math.max(1,Math.ceil((Date.now()-state.start)/60000)),count=state.rented.reduce((s,x)=>s+x.qty,0),amount=count*10000+mins*10000;db.collection('users').doc(u.uid).collection('rentals').doc(rentalDocId).update({status:'paid',payment:{method:'bank',usedPoints:0,amount:amount},paidAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(e=>console.warn(e))}setTimeout(()=>{state.rented=[];state.photo=null;state.analysis=null;state.start=null;save();go('home')},2000)}render();
function loginUser(){const v=[...document.querySelectorAll('.form input')].map(x=>x.value.trim());if(!v[0]||!v[1])return alert('이메일과 비밀번호를 입력해 주세요.');auth.signInWithEmailAndPassword(v[0],v[1]).then(cred=>ensureUserProfile(cred.user).then(()=>go('home'))).catch(e=>alert('로그인 실패: '+e.message))}function ensureUserProfile(user,name){const data={email:user.email||'',displayName:name||user.displayName||'',updatedAt:firebase.firestore.FieldValue.serverTimestamp()};return db.collection('users').doc(user.uid).set(data,{merge:true}).catch(e=>{console.error('Firestore 사용자 저장 실패',e);alert('인증은 완료되었지만 Firestore 회원정보 저장에 실패했습니다. Firebase Rules를 배포했는지 확인해 주세요.');return Promise.resolve()})}function logout(){auth.signOut().finally(()=>{state.screen='login';state.rented=[];state.start=null;save();render()})}function registerUser(){const v=[...document.querySelectorAll('.form input')].map(x=>x.value.trim());const email=v[0],name=v[1],password=v[2],confirm=v[3];if(!email||!password)return alert('이메일과 비밀번호를 입력해 주세요.');if(password!==confirm)return alert('비밀번호가 일치하지 않습니다.');auth.createUserWithEmailAndPassword(email,password).then(cred=>ensureUserProfile(cred.user,name).then(()=>{alert('회원가입이 완료되었습니다.');go('home')})).catch(e=>{console.error('Firebase Authentication 회원가입 실패',e);alert('회원가입 실패: '+(e.code==='auth/email-already-in-use'?'이미 가입된 이메일입니다.':e.message))})}
</script></body></html>
